databases:
  - name: attendance-db
    plan: basic-256mb        # paid; free Postgres expires after 30 days
    region: singapore
    databaseName: attendance_db
    user: attendance_user

services:
  - type: keyvalue
    name: attendance-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # internal access only

  - type: web
    name: attendance-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /docs   # change to your own /health route if you have one
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # Database + Redis (wired automatically)
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: attendance-redis
          property: connectionString

      # Secrets generated by Render
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: SCAN_SECRET
        generateValue: true

      # Token settings
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: SCAN_TOKEN_EXPIRE_MINUTES
        value: "1"

      # CORS: put your dashboard URL (comma-separated for several)
      - key: ALLOWED_ORIGINS
        value: https://dashboard-thesis.sam123khmer22.workers.dev

      # Office settings
      - key: OFFICE_ID
        value: HEAD_OFFICE
      - key: OFFICE_LATITUDE
        value: "11.5564"
      - key: OFFICE_LONGITUDE
        value: "104.9282"
      - key: OFFICE_RADIUS_METERS
        value: "100"
      - key: OFFICE_OPEN_TIME
        value: "09:00"
      - key: OFFICE_CLOSE_TIME
        value: "17:00"

      # Cloudinary: Render asks for these in the dashboard (not stored in git)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false